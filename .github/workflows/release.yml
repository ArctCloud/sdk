name: Release

on:
  push:
    tags: ['python-v*', 'typescript-v*', 'cli-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.check.outputs.package }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - id: check
        run: |
          package="${GITHUB_REF_NAME%%-v*}"
          release_version=$(python scripts/release_check.py "$package")
          echo "package=$package" >> "$GITHUB_OUTPUT"
          if [[ "$release_version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  python-build:
    needs: [version, checks]
    if: needs.version.outputs.package == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'build>=1.2,<2'
      - run: python -m build python
      - run: python scripts/release_smoke.py python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error

  pypi:
    needs: python-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  typescript-build:
    needs: [version, checks]
    if: needs.version.outputs.package == 'typescript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify provenance repository
        working-directory: typescript
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = typeof pkg.repository === 'string' ? pkg.repository : pkg.repository?.url;
          if (url !== `https://github.com/${process.env.GITHUB_REPOSITORY}.git`) {
            throw new Error('Set package.json repository.url to the publishing GitHub repository URL');
          }
          JS
      - working-directory: typescript
        run: |
          npm ci
          npm run build
          mkdir -p release-dist
          npm pack --pack-destination release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-distribution
          path: typescript/release-dist/*.tgz
          if-no-files-found: error

  npm:
    needs: [version, typescript-build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-distribution
          path: dist
      - name: Publish with OIDC and provenance
        env:
          IS_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          npm_tag=latest
          if [ "$IS_PRERELEASE" = true ]; then npm_tag=next; fi
          npm publish ./dist/*.tgz --access public --provenance --ignore-scripts --tag "$npm_tag"

  cli-build:
    needs: [version, checks]
    if: needs.version.outputs.package == 'cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: python scripts/release_cli.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: dist/cli/*
          if-no-files-found: error

  github-release:
    needs: [version, cli-build]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: dist/cli
      - name: Publish standalone binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/cli/* --verify-tag --generate-notes "${flags[@]}"
